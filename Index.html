<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
position:relative;
}

/* Stars */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle,#fff 2px,transparent 2px);
background-size:50px 50px;
animation:stars 20s linear infinite;
opacity:.9;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(50px);}
}

/* Main Box */
.card{
position:relative;
width:90%;
max-width:420px;
background:#050505;
border-radius:30px;
padding:35px 20px;
text-align:center;
z-index:1;
}

/* RGB Ambient Light */
.card::before{
content:"";
position:absolute;
top:-6px;
left:-6px;
right:-6px;
bottom:-6px;
border-radius:35px;
background:linear-gradient(
45deg,
#ff0000,
#ff00ff,
#00ffff,
#00ff00,
#ffff00,
#ff0000
);
background-size:400%;
z-index:-1;
filter:blur(18px);
animation:rgb 6s linear infinite;
}

@keyframes rgb{
0%{background-position:0 0;}
100%{background-position:400% 0;}
}

.logo{
width:140px;
height:140px;
border-radius:50%;
border:4px solid #00ffff;
object-fit:cover;
box-shadow:
0 0 20px #00ffff,
0 0 40px #00ffff;
margin-bottom:20px;
}

h1{
color:#fff;
font-size:36px;
font-weight:900;
margin-bottom:15px;
}

.info{
color:#fff;
font-size:22px;
line-height:1.8;
font-weight:bold;
}

.highlight{
color:#00ffcc;
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.btn{
display:inline-block;
margin-top:30px;
padding:18px 45px;
border-radius:50px;
background:linear-gradient(90deg,#00ffd5,#00cfff);
color:#000;
font-size:24px;
font-weight:900;
text-decoration:none;
box-shadow:
0 0 20px #00ffd5,
0 0 50px #00ffd5;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}
</style>
</head>
