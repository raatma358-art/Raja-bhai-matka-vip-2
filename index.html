<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
position:relative;
}

/* Animated Stars */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:
radial-gradient(circle,#fff 2px,transparent 2px);
background-size:60px 60px;
animation:starsMove 15s linear infinite;
opacity:.8;
}

@keyframes starsMove{
0%{transform:translateY(0);}
100%{transform:translateY(60px);}
}

/* Main Card */
.card{
position:relative;
width:90%;
max-width:420px;
background:#050505;
padding:30px 20px;
border-radius:30px;
text-align:center;
z-index:1;
}

/* RGB Border */
.card::before{
content:"";
position:absolute;
top:-4px;
left:-4px;
right:-4px;
bottom:-4px;
border-radius:34px;
background:linear-gradient(
90deg,
#ff0000,
#ff00ff,
#00ffff,
#00ff00,
#ffff00,
#ff0000
);
background-size:400%;
animation:rgb 5s linear infinite;
z-index:-2;
}

/* Ambient Light */
.card::after{
content:"";
position:absolute;
top:-20px;
left:-20px;
right:-20px;
bottom:-20px;
background:linear-gradient(
90deg,
#ff00ff,
#00ffff,
#00ff00,
#ffff00,
#ff00ff
);
background-size:400%;
filter:blur(40px);
opacity:.8;
animation:rgb 5s linear infinite;
z-index:-3;
border-radius:50px;
}

@keyframes rgb{
0%{background-position:0% 50%;}
100%{background-position:400% 50%;}
}

.logo{
width:140px;
height:140px;
border-radius:50%;
border:4px solid #00ffff;

0 0 20px #00ffff,
0 0 40px #00ffff;
margin-bottom:20px;
}

0 0 20px #00ffd5,
0 0 50px #00ffd5;
transition:.3s;
}

.btn:hover{
